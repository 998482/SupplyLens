<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
    <style>
        html,body{margin:0;padding:0;width:100%;height:100%;background:#0A0F1E;overflow:hidden;}
        canvas{display:block;width:100%;height:100%;}
        #cursor{
          width:14px;height:14px;border-radius:50%;
          background:#06B6D4;
          box-shadow:0 0 10px #06B6D4;
          position:fixed;pointer-events:none;z-index:999;
          transition:left 1.4s cubic-bezier(.4,0,.2,1),
                     top  1.4s cubic-bezier(.4,0,.2,1);
        }
        #cursor::after{
          content:'';position:absolute;
          width:26px;height:26px;border-radius:50%;
          border:1.5px solid rgba(6,182,212,0.4);
          top:-7px;left:-7px;
          animation:ping 1.6s ease-out infinite;
        }
        @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
        #info{
          position:fixed;bottom:12px;left:12px;
          background:rgba(10,15,30,0.88);
          border:1px solid #1F2937;
          color:#06B6D4;font-family:monospace;font-size:10px;
          padding:6px 10px;border-radius:6px;
          max-width:220px;line-height:1.5;
          z-index:999;
        }
        #legend{
          position:fixed;top:12px;right:12px;
          background:rgba(10,15,30,0.88);
          border:1px solid #1F2937;
          padding:8px 12px;border-radius:8px;
          font-family:monospace;font-size:10px;
          color:#94A3B8;line-height:2;z-index:999;
        }
        .dot{display:inline-block;width:8px;height:8px;
             border-radius:2px;margin-right:6px;vertical-align:middle;}
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cursor"></div>
<div id="info">🤖 AI scanning network...</div>
<div id="legend">
    <div><span class="dot" style="background:#3B82F6"></span>Supplier</div>
    <div><span class="dot" style="background:#EAB308"></span>Factory</div>
    <div><span class="dot" style="background:#F97316"></span>Warehouse</div>
    <div><span class="dot" style="background:#22C55E"></span>Customer</div>
    <div><span class="dot" style="background:#EF4444"></span>Disrupted</div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const cursorEl = document.getElementById('cursor');
    const infoEl   = document.getElementById('info');

    function resize(){
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const NODES = [
      {id:'shanghai_supplier',  name:'Shanghai',   type:'supplier',  lat:31.2,  lng:121.5},
      {id:'shenzhen_supplier',  name:'Shenzhen',   type:'supplier',  lat:22.5,  lng:114.1},
      {id:'taipei_supplier',    name:'Taipei',     type:'supplier',  lat:25.0,  lng:121.5},
      {id:'mumbai_supplier',    name:'Mumbai',     type:'supplier',  lat:19.1,  lng:72.9 },
      {id:'chongqing_factory',  name:'Chongqing',  type:'factory',   lat:29.6,  lng:106.6},
      {id:'tijuana_factory',    name:'Tijuana',    type:'factory',   lat:32.5,  lng:-117.0},
      {id:'bratislava_factory', name:'Bratislava', type:'factory',   lat:48.1,  lng:17.1 },
      {id:'la_port',            name:'LA Port',    type:'warehouse', lat:33.7,  lng:-118.2},
      {id:'rotterdam_port',     name:'Rotterdam',  type:'warehouse', lat:51.9,  lng:4.5  },
      {id:'singapore_port',     name:'Singapore',  type:'warehouse', lat:1.3,   lng:103.8},
      {id:'newark_port',        name:'Newark',     type:'warehouse', lat:40.7,  lng:-74.2},
      {id:'chicago_customer',   name:'Chicago',    type:'customer',  lat:41.9,  lng:-87.6},
      {id:'london_customer',    name:'London',     type:'customer',  lat:51.5,  lng:-0.1 },
      {id:'tokyo_customer',     name:'Tokyo',      type:'customer',  lat:35.7,  lng:139.7},
      {id:'sydney_customer',    name:'Sydney',     type:'customer',  lat:-33.9, lng:151.2}
    ];

    const LINKS = [
      ['shanghai_supplier','la_port'],
      ['shenzhen_supplier','la_port'],
      ['taipei_supplier',  'la_port'],
      ['mumbai_supplier',  'rotterdam_port'],
      ['chongqing_factory','la_port'],
      ['tijuana_factory',  'la_port'],
      ['bratislava_factory','rotterdam_port'],
      ['la_port',          'chicago_customer'],
      ['rotterdam_port',   'london_customer'],
      ['singapore_port',   'tokyo_customer'],
      ['singapore_port',   'sydney_customer'],
      ['la_port',          'newark_port'],
      ['newark_port',      'chicago_customer'],
      ['rotterdam_port',   'newark_port']
    ];

    const COLOR = {
      supplier:'#3B82F6', factory:'#EAB308',
      warehouse:'#F97316', customer:'#22C55E', affected:'#EF4444'
    };

    let affectedIds = new Set();
    let dash = 0;

    function proj(lat, lng){
      // Mercator-like projection with padding
      const pad = 0.08;
      const x = (lng + 180) / 360;
      const latR = lat * Math.PI / 180;
      const y = 0.5 - Math.log(Math.tan(Math.PI/4 + latR/2)) / (2*Math.PI);
      const W = canvas.width;
      const H = canvas.height;
      return {
        x: W * (pad + x * (1 - 2*pad)),
        y: H * (pad + y * (1 - 2*pad))
      };
    }

    function getNode(id){ return NODES.find(n=>n.id===id); }

    function drawFrame(){
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);

      // Background
      ctx.fillStyle = '#0A0F1E';
      ctx.fillRect(0,0,W,H);

      // Subtle grid
      ctx.strokeStyle = 'rgba(31,41,55,0.5)';
      ctx.lineWidth = 0.4;
      for(let i=0;i<=5;i++){
        ctx.beginPath();
        ctx.moveTo(0, H*i/5);
        ctx.lineTo(W, H*i/5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(W*i/5, 0);
        ctx.lineTo(W*i/5, H);
        ctx.stroke();
      }

      // Links
      LINKS.forEach(([a,b])=>{
        const sn = getNode(a), tn = getNode(b);
        if(!sn||!tn) return;
        const sp = proj(sn.lat,sn.lng);
        const tp = proj(tn.lat,tn.lng);
        const isAff = affectedIds.has(a)||affectedIds.has(b);

        ctx.save();
        ctx.setLineDash([4,7]);
        ctx.lineDashOffset = -dash;
        ctx.strokeStyle = isAff ? 'rgba(239,68,68,0.75)' : 'rgba(6,182,212,0.22)';
        ctx.lineWidth   = isAff ? 1.4 : 0.7;

        const mx = (sp.x+tp.x)/2;
        const my = Math.min(sp.y,tp.y) - Math.abs(tp.x-sp.x)*0.18;

        ctx.beginPath();
        ctx.moveTo(sp.x, sp.y);
        ctx.quadraticCurveTo(mx, my, tp.x, tp.y);
        ctx.stroke();
        ctx.restore();
      });

      // Nodes
      NODES.forEach(node=>{
        const p = proj(node.lat, node.lng);
        const isAff = affectedIds.has(node.id);
        const col = isAff ? COLOR.affected : COLOR[node.type];
        const sz = 7;

        if(isAff){
          // Glow ring
          ctx.save();
          ctx.shadowColor = '#EF4444';
          ctx.shadowBlur  = 14;
          ctx.fillStyle   = '#EF4444';
          ctx.fillRect(p.x-sz, p.y-sz, sz*2, sz*2);
          ctx.restore();
        }

        ctx.fillStyle = col;
        ctx.fillRect(p.x-sz/2, p.y-sz/2, sz, sz);

        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 0.6;
        ctx.strokeRect(p.x-sz/2, p.y-sz/2, sz, sz);

        // Name label
        ctx.fillStyle = isAff ? '#EF4444' : 'rgba(148,163,184,0.85)';
        ctx.font = '8px monospace';
        ctx.fillText(node.name, p.x + 6, p.y + 3);
      });

      dash += 0.25;
      requestAnimationFrame(drawFrame);
    }

    drawFrame();

    // ── AI Cursor ──
    let cIdx = 0;
    let scanNodes = [...NODES];

    function moveCursor(){
      if(scanNodes.length === 0) scanNodes = [...NODES];
      const target = scanNodes[cIdx % scanNodes.length];
      const p = proj(target.lat, target.lng);

      cursorEl.style.left = (p.x - 7) + 'px';
      cursorEl.style.top  = (p.y - 7) + 'px';

      const isAff = affectedIds.has(target.id);
      cursorEl.style.background  = isAff ? '#EF4444' : '#06B6D4';
      cursorEl.style.boxShadow   = isAff
        ? '0 0 12px #EF4444, 0 0 4px #EF4444'
        : '0 0 12px #06B6D4, 0 0 4px #06B6D4';

      infoEl.innerHTML = '🤖 AI scanning: <b style="color:#F1F5F9">'
        + target.name + '</b>'
        + (isAff ? ' &nbsp;<span style="color:#EF4444">⚠ DISRUPTED</span>' : '');

      cIdx++;
    }

    // Start after short delay so canvas is ready
    setTimeout(()=>{ moveCursor(); setInterval(moveCursor, 1800); }, 300);

    // Called from Android Kotlin
    function updateAffected(idsJson){
      try {
        affectedIds = new Set(JSON.parse(idsJson));
        scanNodes = affectedIds.size > 0
          ? NODES.filter(n=>affectedIds.has(n.id))
          : [...NODES];
        cIdx = 0;
      } catch(e){}
    }
</script>
</body>
</html>
